<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merch Store</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2421;--muted:#6b726d;--line:#e4e0d6;--accent:#1f5f4a;--accent-ink:#fff;--accent-soft:#e3efe9;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#151816;--card:#1d211f;--ink:#ecebe6;--muted:#9aa29c;--line:#2c322f;--accent:#5fbf9a;--accent-ink:#0e1a15;--accent-soft:#22332c;--warn:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin-bottom:16px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;background:var(--accent-soft)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=email]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:6px}
.mono{height:84px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.photo{height:190px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{max-width:100%;max-height:100%;object-fit:contain}
.photo[role=button]{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb.on{display:flex}
#lb .stage{position:relative;max-width:min(94vw,900px);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:10px}
#lb img{max-width:100%;max-height:78vh;background:#fff;border-radius:10px;object-fit:contain}
#lb .cap{color:#fff;font-size:14px;text-align:center}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.92);color:#111;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
#lb .x{top:-8px;right:-8px}#lb .pv{left:-8px;top:40%}#lb .nx{right:-8px;top:40%}
@media(max-width:600px){#lb .x{top:4px;right:4px}#lb .pv{left:4px}#lb .nx{right:4px}}
.thumbs{display:flex;gap:6px}
.thumbs button{width:38px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.thumbs button[aria-current=true]{outline:2px solid var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.cat{grid-column:1/-1;margin:10px 0 0;font-size:18px}
.item h3{margin:2px 0 0;font-size:16px}
.desc{color:var(--muted);font-size:13px;min-height:18px}
.price{font-weight:700}
.stepper{display:flex;align-items:center;gap:8px;margin-top:auto}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper.sized{margin-top:0}.stepper.sized .sz{width:34px;font-weight:600}.stepper:first-of-type{margin-top:auto}
.q{min-width:24px;text-align:center;font-weight:600}
.side{position:sticky;top:12px}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.meter>div{height:100%;background:var(--accent);transition:width .2s}
.row{display:flex;justify-content:space-between;gap:8px}
.big{font-size:22px;font-weight:700}
h2{font-size:18px;margin:16px 0 6px}
.cartline{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:11px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line);width:auto;padding:8px 12px;font-weight:500;margin-top:8px}
.muted{color:var(--muted)}
.msg{margin-top:8px;font-size:13px}.err{color:var(--warn)}
.hide{display:none!important}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Merch Store</h1>
  <div class="sub" id="subtitle">Pick your items. Your cart can't go over your budget.</div>
  <div id="banner" class="banner hide"></div>

  <div id="shop" class="layout">
    <div>
      <div class="card" style="margin-bottom:12px">
        <div class="names">
          <div><label for="first">First name</label><input type="text" id="first" autocomplete="given-name" maxlength="50"></div>
          <div><label for="last">Last name</label><input type="text" id="last" autocomplete="family-name" maxlength="50"></div>
        </div>
        <label for="email" style="margin-top:12px">Your email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" maxlength="120" inputmode="email">
      </div>
      <div id="grid" class="grid"></div>
    </div>
    <aside class="side card">
      <div class="row"><span class="muted">Your budget</span><strong id="budget">$0.00</strong></div>
      <div class="meter"><div id="bar" style="width:0%"></div></div>
      <div class="row"><span class="muted">Remaining</span><span id="remaining">$0.00</span></div>
      <h2>Your cart</h2>
      <div id="cart"></div>
      <div class="row" style="margin:12px 0"><span>Total</span><span class="big" id="total">$0.00</span></div>
      <button class="btn" id="submit">Submit order</button>
      <div class="msg" id="msg"></div>
    </aside>
  </div>

  <div id="done" class="card hide">
    <h2 style="margin-top:0" id="doneTitle">Order received</h2>
    <p id="doneText"></p>
    <pre id="summary" class="hide"></pre>
    <button class="btn sec hide" id="copy">Copy order summary</button>
    <button class="btn sec" id="again">Change my order</button>
  </div>
</div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer"><div class="stage"><img id="lbImg" alt=""><div class="cap" id="lbCap"></div><button class="x" id="lbX" aria-label="Close">&times;</button><button class="pv" id="lbPv" aria-label="Previous photo">&lsaquo;</button><button class="nx" id="lbNx" aria-label="Next photo">&rsaquo;</button></div></div>
<script src="config.js"></script>
<script>
(function(){
  var C = window.STORE_CONFIG, $ = function(i){return document.getElementById(i);};
  var cents = function(d){return Math.round(Number(d||0)*100);};
  var money = function(c){return "$"+(c/100).toFixed(2);};
  var cart = {};
  function el(t,a,k){var e=document.createElement(t);if(a)for(var x in a){if(x==="text")e.textContent=a[x];else if(x==="class")e.className=a[x];else e.setAttribute(x,a[x]);}(k||[]).forEach(function(c){e.appendChild(c);});return e;}
  function key(n){return n.trim().toLowerCase().replace(/\s+/g," ");}
  function listed(n){return Object.prototype.hasOwnProperty.call(C.members||{},key(n));}
  function fullName(){return ($("first").value.trim()+" "+$("last").value.trim()).replace(/\s+/g," ").trim();}
  function namesOk(){return $("first").value.trim()&&$("last").value.trim();}
  function budget(){var n=fullName(); return listed(n)?cents(C.members[key(n)]):cents(C.defaultBudget);}
  function variants(it){
    if(it.sizes&&it.sizes.length) return it.sizes.map(function(z){return {key:it.id+"|"+z,label:z,name:it.name+" ("+z+")",size:z};});
    return [{key:it.id,label:null,name:it.name,size:""}];
  }
  function lines(){
    var out=[];
    C.items.forEach(function(it){variants(it).forEach(function(v){
      if(cart[v.key]>0)out.push({id:v.key,name:v.name,size:v.size,price:it.price,qty:cart[v.key],exempt:!!it.budgetExempt});
    });});
    return out;
  }
  function total(){return lines().reduce(function(s,l){return l.exempt?s:s+cents(l.price)*l.qty;},0);}
  function emailOk(){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test($("email").value.trim());}
  function nameOk(){var n=fullName(); return namesOk() && (!C.requireListedName || listed(n));}

  var lb={imgs:[],i:0,name:"",opener:null};
  function lbShow(){
    $("lbImg").src=lb.imgs[lb.i]; $("lbImg").alt=lb.name;
    $("lbCap").textContent=lb.name+(lb.imgs.length>1?" ("+(lb.i+1)+" of "+lb.imgs.length+")":"");
    $("lbPv").style.display=$("lbNx").style.display=lb.imgs.length>1?"":"none";
  }
  function lbOpen(imgs,i,name,opener){lb={imgs:imgs,i:i,name:name,opener:opener};lbShow();$("lb").classList.add("on");$("lbX").focus();}
  function lbClose(){$("lb").classList.remove("on"); if(lb.opener)lb.opener.focus();}
  function lbStep(d){lb.i=(lb.i+d+lb.imgs.length)%lb.imgs.length;lbShow();}
  $("lbX").onclick=lbClose; $("lbPv").onclick=function(){lbStep(-1);}; $("lbNx").onclick=function(){lbStep(1);};
  $("lb").addEventListener("click",function(e){if(e.target===$("lb"))lbClose();});
  document.addEventListener("keydown",function(e){
    if(!$("lb").classList.contains("on"))return;
    if(e.key==="Escape")lbClose(); else if(e.key==="ArrowLeft"&&lb.imgs.length>1)lbStep(-1); else if(e.key==="ArrowRight"&&lb.imgs.length>1)lbStep(1);
  });
  var shown={};
  function photoBlock(it){
    var imgs=it.images||(it.image?[it.image]:[]);
    var box=el("div",{class:"photo"});
    if(!imgs.length){ box.appendChild(el("div",{text:"Photo coming soon",style:"color:#8a908b;font-size:13px"})); return box; }
    var idx=shown[it.id]||0, main=el("img",{src:imgs[idx],alt:it.name,loading:"lazy"}); box.appendChild(main);
    box.setAttribute("role","button"); box.setAttribute("tabindex","0"); box.setAttribute("aria-label","View larger photo of "+it.name);
    box.onclick=function(){lbOpen(imgs,shown[it.id]||0,it.name,box);};
    box.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();box.click();}};
    if(imgs.length<2) return box;
    var th=el("div",{class:"thumbs"});
    imgs.forEach(function(u,i){
      var b=el("button",{type:"button","aria-label":"Show photo "+(i+1)+" of "+it.name,"aria-current":String(i===idx)},[el("img",{src:u,alt:""})]);
      b.onclick=function(){ shown[it.id]=i; main.src=u; Array.prototype.forEach.call(th.children,function(c,j){c.setAttribute("aria-current",String(j===i));}); };
      th.appendChild(b);
    });
    var wrap=el("div",{style:"display:flex;flex-direction:column;gap:6px"},[box,th]); return wrap;
  }
  function render(){
    $("title").textContent=C.title; document.title=C.title; if(C.subtitle)$("subtitle").textContent=C.subtitle;
    var b=budget(), t=total(), r=b-t;
    $("budget").textContent=money(b); $("remaining").textContent=money(r); $("total").textContent=money(t);
    $("bar").style.width=(b>0?Math.min(100,t/b*100):(t?100:0))+"%";
    var g=$("grid"); g.textContent="";
    var lastCat=null;
    C.items.forEach(function(it){
      var pc=cents(it.price), bpc=it.budgetExempt?0:pc, vs=variants(it);
      var itemQty=vs.reduce(function(n,v){return n+(cart[v.key]||0);},0), maxed=!!it.maxQty && itemQty>=it.maxQty;
      var ctrls=vs.map(function(v){
        var q=cart[v.key]||0;
        var m=el("button",{"aria-label":"Remove one "+v.name,text:"\u2212"}); m.disabled=q<=0;
        var p=el("button",{"aria-label":"Add one "+v.name,text:"+"}); p.disabled=C.open===false||bpc>r||maxed;
        m.onclick=function(){set(v.key,bpc,q-1);}; p.onclick=function(){set(v.key,bpc,q+1);};
        var kids=[]; if(v.label)kids.push(el("span",{class:"sz",text:v.label}));
        kids.push(m,el("span",{class:"q",text:String(q)}),p);
        return el("div",{class:"stepper"+(v.label?" sized":"")},kids);
      });
      if(it.category && it.category!==lastCat){ g.appendChild(el("h2",{class:"cat",text:it.category})); lastCat=it.category; }
      g.appendChild(el("div",{class:"card item"},[
        photoBlock(it),
        el("h3",{text:it.name}), el("div",{class:"desc",text:it.desc||""}),
        el("div",{class:"price",text:it.budgetExempt?"Doesn't count toward your budget":money(pc)})
      ].concat(ctrls)));
    });
    var c=$("cart"); c.textContent=""; var ls=lines();
    if(!ls.length)c.appendChild(el("div",{class:"muted",text:"Nothing yet."}));
    ls.forEach(function(l){c.appendChild(el("div",{class:"cartline"},[el("span",{text:l.qty+" × "+l.name}),el("span",{text:l.exempt?"No budget charge":money(cents(l.price)*l.qty)})]));});
    var bn=$("banner");
    if(C.open===false){bn.textContent="Ordering is closed.";bn.classList.remove("hide");}
    else if(C.requireListedName && namesOk() && !listed(fullName())){bn.textContent="That name isn't on the member list. Check the spelling.";bn.classList.remove("hide");}
    else bn.classList.add("hide");
    $("submit").disabled=!(C.open!==false && nameOk() && emailOk() && ls.length && t<=b);
  }
  function set(key,pc,q){
    if(q<0)return;
    var d=(q-(cart[key]||0))*pc;
    if(d>0 && total()+d>budget())return;
    if(q===0)delete cart[key]; else cart[key]=q; $("msg").textContent=""; render();
  }
  $("email").addEventListener("input",render);
  ["first","last"].forEach(function(id){$(id).addEventListener("input",onNameInput);});
  function onNameInput(){
    if(total()>budget()){cart={};$("msg").className="msg err";$("msg").textContent="Cart cleared: it was over this name's budget.";}
    render();
  }
  function summaryText(name,ls,t,b){
    return "Order for "+name+"\n"+ls.map(function(l){return l.qty+" x "+l.name+" ("+money(cents(l.price)*l.qty)+")";}).join("\n")+"\nTotal: "+money(t)+" of "+money(b)+" budget";
  }
  $("submit").onclick=function(){
    var name=fullName(), email=$("email").value.trim(), ls=lines(), t=total(), b=budget();
    if(!nameOk()||!emailOk()||!ls.length||t>b)return;
    var btn=$("submit"); btn.disabled=true; $("msg").className="msg"; $("msg").textContent="Sending…";
    var txt=summaryText(name,ls,t,b)+"\nEmail: "+email;
    function finish(sent){
      $("shop").classList.add("hide"); $("done").classList.remove("hide");
      $("doneTitle").textContent=sent?"Order received":"Order not sent yet";
      $("doneText").textContent=sent?"Thanks, "+name+". You can change your order any time while ordering is open; your latest submission replaces the earlier one."
        :"This store isn't connected to a spreadsheet yet, so nothing was saved. Copy the summary below and send it to the organizer.";
      $("summary").textContent=txt; $("summary").classList.toggle("hide",sent); $("copy").classList.toggle("hide",sent);
    }
    if(!C.endpoint){finish(false);return;}
    fetch(C.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({name:name,email:email,key:key(name),lines:ls,total:t/100,budget:b/100})})
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok)finish(true); else throw new Error((j&&j.error)||"failed"); })
      .catch(function(e){btn.disabled=false;$("msg").className="msg err";$("msg").textContent="Couldn't send your order. Check your connection and try again.";});
  };
  $("copy").onclick=function(){
    var s=$("summary").textContent;
    (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){$("copy").textContent="Copied";},function(){var r=document.createRange();r.selectNodeContents($("summary"));var sel=getSelection();sel.removeAllRanges();sel.addRange(r);});
  };
  $("again").onclick=function(){$("done").classList.add("hide");$("shop").classList.remove("hide");$("submit").disabled=false;render();};
  render();
})();
</script>
</body>
</html>
